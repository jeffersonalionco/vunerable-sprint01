spring.application.name=spring-vulnerable-lab
server.port=8081

spring.datasource.url=jdbc:h2:mem:vulnerablelab
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT — pode ser curto (vira SHA-256 interno) ou >= 32 caracteres direto no HS256
jwt.segredo=scredo-jwt-trabalho
jwt.expiracao-ms=86400000
